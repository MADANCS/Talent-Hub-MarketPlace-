version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: talenthub_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - talenthub_network

  redis:
    image: redis:alpine
    container_name: talenthub_redis
    ports:
      - "6379:6379"
    networks:
      - talenthub_network

  backend:
    build: 
      context: ./backend
    container_name: talenthub_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/talentmarketplace
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=talent_marketplace_super_secret_jwt_key_2024
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - mongodb
      - redis
    networks:
      - talenthub_network

  frontend:
    build: 
      context: ./frontend
    container_name: talenthub_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - talenthub_network

volumes:
  mongodb_data:

networks:
  talenthub_network:
    driver: bridge
